<div class="wrapper-root">
  <div class="post">
    <div class="card">
      <div class="card-header">
        <div class="card-actions">
          <button type="button" (click)="fetchReportData()" class="btn-refresh">
            <i class="ki-outline ki-arrows-loop fs-2"></i> Refresh
          </button>
          <button type="button" (click)="exportExcel()" class="btn-export">
            <i class="ki-outline ki-exit-up fs-2"></i> Export
          </button>
        </div>
      </div>
      
      <div class="search-container">
        <input
          matInput
          type="text"
          placeholder="Search..."
          class="search-bar"
        />
      </div>
  
      <div class="card-body">
        <div class="table-wrapper">
          <table mat-table matSort [dataSource]="tableDataSource" class="mat-elevation-z4">
            <ng-container *ngFor="let column of displayedColumns" [matColumnDef]="column">
              <th mat-header-cell mat-sort-header *matHeaderCellDef> {{ column }} </th>
              <td mat-cell *matCellDef="let element"> {{ element[column] }} </td>
            </ng-container>
          
            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
          </table>
  
          <mat-paginator [length]="totalCount()" [pageSizeOptions]="[5, 10, 25, 50]" showFirstLastButtons></mat-paginator>
        </div>
      </div>
    </div>
  </div>
  


</div>
