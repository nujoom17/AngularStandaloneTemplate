<div class="container">
    <mat-toolbar color="primary">
      <span class="spacer"></span>
      <button mat-icon-button (click)="authService.logout()">
        <mat-icon>logout</mat-icon>
      </button>
    </mat-toolbar>
    <button class="btn-general" (click)="tableType == 'material'? tableType='regular':tableType='material'">Switch Table type</button>
    <!--Re usable table component, pass the names of the columns in custom headers ng-template and the respective row data items in customRows and use anywhere-->
   @if(tableType == 'regular'){
     <app-report-table
     #reportTable
     [reportData]="reportData"
     (fetchReportDataEvent)="fetchReportData()"
   >
     <ng-template #customHeaders>  
       <th class="min-w-60px">Entity Name</th>
       <th class="min-w-60px">
         Entity Contact
       </th>
       <th class="min-w-60px">
         Type
       </th>
       <th class="min-w-60px">
         Extra Info
       </th>
    
     </ng-template>
     <ng-template #customRows let-item>
       <td>{{ item?.EntityName }}</td>
       <td>{{ item?.EntityContact }}</td>
       <td>{{ item?.Type }}</td>
       <td>{{ item?.ExtraInfo }}</td>
    
     </ng-template>
     </app-report-table>

     @if(totalCount>0){
      <app-pagination
      style="width:75% !important"
      [showPageIndex]="true"
      [pageConfig]="pageConfig()"
      [pagesVisible]="pagesVisible()"
      [totalCount]="totalCount"
      (pageData)="pageUpdated($event)"
    ></app-pagination>
    }
   }@else{
    <app-mat-table-common
    [dataSource]="reportData"
    [displayedColumns]="['EntityName','EntityContact','Type','ExtraInfo']">
  </app-mat-table-common>
   }

   
    
  
  </div>
